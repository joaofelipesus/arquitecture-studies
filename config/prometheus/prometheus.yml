global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Rails request metrics (yabeda-rails) and Puma stats (yabeda-puma-plugin).
  - job_name: rails
    static_configs:
      - targets: ["app:9394", "app2:9394", "app3:9394", "app4:9394"]

  # PostgreSQL internals: connections, transactions, locks, database sizes, ...
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Container CPU, memory, network and filesystem usage for every service.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    # cAdvisor sees every container on the Docker host; keep only this project's.
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: books-library
        action: keep
