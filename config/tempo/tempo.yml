# Single-binary Tempo for local dev: receives the apps' traces over OTLP and keeps them on local disk.
stream_over_http_enabled: true

server:
  http_listen_port: 3200 # query API, used by Grafana

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318 # the apps export here (OTEL_EXPORTER_OTLP_ENDPOINT)
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h # traces are only useful for the latest load test runs

# Turns spans into Prometheus metrics (request rate, errors and duration per span, plus the service graph)
# and pushes them to Prometheus' remote write receiver.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
      processor:
        span_metrics:
          # Adds a service_instance_id label (app, app2, ...) to split the APM dashboard by instance.
          dimensions: [service.instance.id]
          # 0.5 and 2 are the Apdex thresholds (T = 0.5s); the top buckets catch the k6 120s timeouts.
          histogram_buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 30, 60, 120]
