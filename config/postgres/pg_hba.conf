# Client authentication for the `postgres` service (docker-compose.yml). Local dev only: everything is trusted,
# like POSTGRES_HOST_AUTH_METHOD=trust, plus replication connections from other containers, which that setting
# doesn't cover and the `postgres-replica` service needs.
# TYPE  DATABASE     USER  ADDRESS  METHOD
local   all          all            trust
host    all          all   all      trust
local   replication  all            trust
host    replication  all   all      trust
