# Load balancer in front of the Rails app instances (docker-compose.yml `nginx` service).
worker_processes auto;

events {
  # Each in-flight request holds a client and an upstream connection; the load test keeps up to 1000 VUs open.
  worker_connections 4096;
}

http {
  access_log off; # one line per request adds up at 1000 req/s; the apps log requests anyway

  # Round-robin across the instances; `keepalive` reuses upstream connections instead of opening one per request.
  upstream rails {
    server app:3000;
    server app2:3000;
    server app3:3000;
    server app4:3000;
    keepalive 64;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://rails;
      proxy_http_version 1.1;
      proxy_set_header Connection ""; # required for upstream keepalive
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Longer than k6's 60s request timeout, so slow responses show up as k6 timeouts rather than nginx 504s.
      proxy_read_timeout 65s;
    }
  }
}
