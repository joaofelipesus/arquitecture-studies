services:
  postgres:
    image: postgres:17
    # pg_hba.conf also lets postgres-replica connect for replication. max_slot_wal_keep_size caps the WAL kept for a
    # replica that stops reading, so a dead replica can't fill the disk (it then has to be rebuilt).
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "max_slot_wal_keep_size=4GB"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./config/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # Read-only streaming replica of `postgres`. Its first boot (empty volume) copies the primary with pg_basebackup,
  # then it replays the primary's WAL continuously (config/postgres/replica-entrypoint.sh). To rebuild it from
  # scratch: docker compose rm -sf postgres-replica && docker volume rm books-library_postgres-replica.
  postgres-replica:
    image: postgres:17
    user: postgres
    entrypoint: ["bash", "/usr/local/bin/replica-entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-replica:/var/lib/postgresql/data
      - ./config/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    ports:
      - "5434:5432" # 5433 is the primary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 60 # the first boot copies the whole primary
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  redis:
    image: redis:7.4-alpine
    # Stays below the 500 MB container limit (Redis needs headroom beyond maxmemory) and evicts the least
    # recently used keys when full, instead of being OOM-killed. No persistence: it only holds cache data.
    command: redis-server --maxmemory 400mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6380:6379" # host 6379 is often taken by a local Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 500M

  app: &app
    hostname: app # reported as service.instance.id on the traces
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f /usr/src/app/tmp/pids/server.pid && (bundle check || bundle install) && ./bin/rails db:prepare && ./bin/dev -b 0.0.0.0"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
      - "9394:9394" # Prometheus metrics (Puma + Rails)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 60 # the first boot can take a while (bundle install + db:prepare)
    volumes:
      - .:/usr/src/app
      - gems:/gems
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_REPLICA_HOST=postgres-replica # reading role (config/database.yml)
      - RAILS_ENV=${RAILS_ENV:-development} # k6/run_load_tests.sh sets RAILS_ENV=production
      # OpenTelemetry traces, sent to Tempo (config/initializers/opentelemetry.rb).
      - OTEL_SERVICE_NAME=books-library
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      # Kredis (config/redis/shared.yml) and the production Rails.cache, in separate Redis databases.
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_TEST_URL=redis://redis:6379/2
    env_file:
      - path: .env/dev.secrets
        required: false
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1536M # 1.5 GB

  # Second instance of the app, with the same image, code, gems, env and resources as `app`.
  app2:
    <<: *app
    hostname: app2
    # Waits for `app`, which installs the gems and prepares the database, so the two don't race on either.
    depends_on:
      app:
        condition: service_healthy
    # Own pid file: both containers share tmp/ through the bind mount, so the default tmp/pids/server.pid would clash.
    command: bash -c "rm -f /usr/src/app/tmp/pids/app2.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app2.pid"
    ports:
      - "3002:3000" # 3001 is Grafana
      - "9395:9394" # Prometheus metrics (Puma + Rails)

  # Third and fourth instances, same setup as `app2`.
  app3:
    <<: *app
    hostname: app3
    depends_on:
      app:
        condition: service_healthy
    command: bash -c "rm -f /usr/src/app/tmp/pids/app3.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app3.pid"
    ports:
      - "3003:3000"
      - "9396:9394" # Prometheus metrics (Puma + Rails)

  app4:
    <<: *app
    hostname: app4
    depends_on:
      app:
        condition: service_healthy
    command: bash -c "rm -f /usr/src/app/tmp/pids/app4.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app4.pid"
    ports:
      - "3004:3000"
      - "9397:9394" # Prometheus metrics (Puma + Rails)

  # Load balancer in front of the app instances (round-robin, see config/nginx/nginx.conf).
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - app2
      - app3
      - app4
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ""
    command:
      - --collector.postmaster # server start time, for the PostgreSQL dashboard's uptime panel
    ports:
      - "9187:9187"

  # Redis memory, keys and commands for Prometheus (Redis row on the Grafana Overview dashboard).
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    privileged: true
    cgroup: host # see the other containers' cgroups (cgroup v2)
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "8081:8080" # host 8080 is often taken

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - app
      - postgres-exporter
      - redis-exporter
      - cadvisor
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver # k6 pushes its load test results here
      - --web.enable-admin-api # allows deleting series by hand (e.g. an old load test run's k6_* series)
      - --enable-feature=exemplar-storage # keeps the trace ids Tempo attaches to its span metrics
    ports:
      - "9090:9090"

  # Stores the apps' OpenTelemetry traces (config/tempo/tempo.yml) and derives span metrics from them,
  # pushed to Prometheus. Explore them on Grafana with the Tempo data source.
  tempo:
    image: grafana/tempo:2.8.2
    user: root # writes to the tempo volume, which Docker creates owned by root
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo:/var/tempo
    ports:
      - "3200:3200" # query API

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - prometheus
      - tempo
    environment:
      # Local dev only: log in as admin/admin, or browse anonymously as a viewer.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is the Rails app

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load-tests"] # not started by `docker compose up`; run with `docker compose run --rm k6 run tests/<file>.js`
    depends_on:
      - nginx
      - prometheus
    working_dir: /scripts
    environment:
      BASE_URL: http://nginx # the load balancer, which spreads requests across the app instances
      # Push results to Prometheus (Grafana "Load tests" dashboard).
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),avg,min,max
    volumes:
      - ./k6:/scripts:ro

volumes:
  postgres:
  postgres-replica:
  gems:
  prometheus:
  grafana:
  tempo:
