services:
  postgres:
    image: postgres:17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  app:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f /usr/src/app/tmp/pids/server.pid && (bundle check || bundle install) && ./bin/rails db:prepare && ./bin/dev -b 0.0.0.0"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
      - "9394:9394" # Prometheus metrics (Puma + Rails)
    volumes:
      - .:/usr/src/app
      - gems:/gems
    environment:
      - DATABASE_HOST=postgres
    env_file:
      - path: .env/dev.secrets
        required: false
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ""
    command:
      - --collector.postmaster # server start time, for the PostgreSQL dashboard's uptime panel
    ports:
      - "9187:9187"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    privileged: true
    cgroup: host # see the other containers' cgroups (cgroup v2)
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "8081:8080" # host 8080 is often taken

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - app
      - postgres-exporter
      - cadvisor
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - prometheus
    environment:
      # Local dev only: log in as admin/admin, or browse anonymously as a viewer.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is the Rails app

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load-tests"] # not started by `docker compose up`; run with `docker compose run --rm k6 run tests/<file>.js`
    depends_on:
      - app
    working_dir: /scripts
    environment:
      BASE_URL: http://app:3000
    volumes:
      - ./k6:/scripts:ro

volumes:
  postgres:
  gems:
  prometheus:
  grafana:
