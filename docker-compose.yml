services:
  postgres:
    image: postgres:17
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  app: &app
    hostname: app # reported as service.instance.id on the traces
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f /usr/src/app/tmp/pids/server.pid && (bundle check || bundle install) && ./bin/rails db:prepare && ./bin/dev -b 0.0.0.0"
    stdin_open: true
    tty: true
    ports:
      - "3000:3000"
      - "9394:9394" # Prometheus metrics (Puma + Rails)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 60 # the first boot can take a while (bundle install + db:prepare)
    volumes:
      - .:/usr/src/app
      - gems:/gems
    environment:
      - DATABASE_HOST=postgres
      - RAILS_ENV=${RAILS_ENV:-development} # k6/run_load_tests.sh sets RAILS_ENV=production
      # OpenTelemetry traces, sent to Tempo (config/initializers/opentelemetry.rb).
      - OTEL_SERVICE_NAME=books-library
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
    env_file:
      - path: .env/dev.secrets
        required: false
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  # Second instance of the app, with the same image, code, gems, env and resources as `app`.
  app2:
    <<: *app
    hostname: app2
    # Waits for `app`, which installs the gems and prepares the database, so the two don't race on either.
    depends_on:
      app:
        condition: service_healthy
    # Own pid file: both containers share tmp/ through the bind mount, so the default tmp/pids/server.pid would clash.
    command: bash -c "rm -f /usr/src/app/tmp/pids/app2.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app2.pid"
    ports:
      - "3002:3000" # 3001 is Grafana
      - "9395:9394" # Prometheus metrics (Puma + Rails)

  # Third and fourth instances, same setup as `app2`.
  app3:
    <<: *app
    hostname: app3
    depends_on:
      app:
        condition: service_healthy
    command: bash -c "rm -f /usr/src/app/tmp/pids/app3.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app3.pid"
    ports:
      - "3003:3000"
      - "9396:9394" # Prometheus metrics (Puma + Rails)

  app4:
    <<: *app
    hostname: app4
    depends_on:
      app:
        condition: service_healthy
    command: bash -c "rm -f /usr/src/app/tmp/pids/app4.pid && ./bin/dev -b 0.0.0.0 -P tmp/pids/app4.pid"
    ports:
      - "3004:3000"
      - "9397:9394" # Prometheus metrics (Puma + Rails)

  # Load balancer in front of the app instances (round-robin, see config/nginx/nginx.conf).
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
      - app2
      - app3
      - app4
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ""
    command:
      - --collector.postmaster # server start time, for the PostgreSQL dashboard's uptime panel
    ports:
      - "9187:9187"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    privileged: true
    cgroup: host # see the other containers' cgroups (cgroup v2)
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd:/run/containerd:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "8081:8080" # host 8080 is often taken

  prometheus:
    image: prom/prometheus:v3.5.0
    depends_on:
      - app
      - postgres-exporter
      - cadvisor
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver # k6 pushes its load test results here
      - --web.enable-admin-api # lets k6/run_load_tests.sh delete the previous run's k6 series
      - --enable-feature=exemplar-storage # keeps the trace ids Tempo attaches to its span metrics
    ports:
      - "9090:9090"

  # Stores the apps' OpenTelemetry traces (config/tempo/tempo.yml) and derives span metrics from them,
  # pushed to Prometheus. Explore them on Grafana with the Tempo data source.
  tempo:
    image: grafana/tempo:2.8.2
    user: root # writes to the tempo volume, which Docker creates owned by root
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./config/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo:/var/tempo
    ports:
      - "3200:3200" # query API

  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      - prometheus
      - tempo
    environment:
      # Local dev only: log in as admin/admin, or browse anonymously as a viewer.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is the Rails app

  k6:
    image: grafana/k6:1.3.0
    profiles: ["load-tests"] # not started by `docker compose up`; run with `docker compose run --rm k6 run tests/<file>.js`
    depends_on:
      - nginx
      - prometheus
    working_dir: /scripts
    environment:
      BASE_URL: http://nginx # the load balancer, which spreads requests across the app instances
      # Push results to Prometheus (Grafana "Load tests" dashboard).
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),avg,min,max
    volumes:
      - ./k6:/scripts:ro

volumes:
  postgres:
  gems:
  prometheus:
  grafana:
  tempo:
